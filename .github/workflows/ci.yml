name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Windows is in the matrix on purpose. The repo is developed there, line endings
    # differ, and the console codepage is not UTF-8 - which is exactly the kind of thing
    # that passes locally and fails for everyone else.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Confirm there are no runtime dependencies
        run: uv run python scripts/check_no_runtime_deps.py

      - name: Lint
        run: uv run ruff check shared projects observatory scripts tests demo.py

      - name: Format
        run: uv run ruff format --check shared projects observatory scripts tests demo.py

      - name: Tests
        run: uv run pytest -q

      - name: Benchmarks still run and agree with the committed results
        run: |
          uv run python -m projects.p01_switchboard.benchmark
          uv run python -m projects.p02_policy_bench.benchmark
          uv run python -m projects.p03_guardian.benchmark

      # The model arms are deliberately not re-run here. They need a local model for
      # --live, and running them cache-only would rewrite results.json with whatever the
      # cache happens to hold - which the diff check below would then report as drift.
      # Their graders are covered by the test suite, which needs no model.

      - name: Rebuild the published page
        run: uv run python scripts/build_pages.py

      - name: The committed results and the published page did not change
        shell: bash
        run: |
          # results.json is committed and the dashboards read it; docs/ is the published
          # page and is generated from those same files. If re-running either changes
          # what is committed, the published numbers were stale.
          git diff --exit-code -- projects/*/results.json docs/

      - name: Demo
        run: uv run python demo.py
